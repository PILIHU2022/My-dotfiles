<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<!--
 Apple 网页用到的两个「字体族名」在本机的落点（SF Pro / SF Pro Icons）

 现象：music.apple.com 里本该是苹果 logo 的地方显示成 F8 FF 豆腐块，例如
 「经典摇滚代表作品、[F8 FF] Music 经典摇滚」。这个方框是 Firefox 自己的
 missing-glyph 占位符，不是网页画的。

 根因：
   * 站点把 "Apple Music" 替换成 "\uF8FF\u202FMusic"（index~*.js 里的 Cp()），
     U+F8FF 是 Unicode 私用区（PUA）里的苹果 logo。
   * 页面 html 的字体栈是
       -apple-system,BlinkMacSystemFont,Apple Color Emoji,SF Pro,SF Pro Icons,
       Helvetica Neue,Helvetica,Arial,sans-serif
     其中 "SF Pro"、"SF Pro Icons" 在本机都不是真实族名（装的是
     "SF Pro Text"/"SF Pro Display"/"SF Pro Rounded"），于是 fontconfig 把它们
     模糊匹配到 sans-serif 的首族 —— 霞鹜文楷 屏幕阅读版，而文楷没有 U+F8FF。
   * Firefox 对 PUA 不做系统字体回退（原因见本目录 60-web-icon-fonts.conf 的说明），
     只有当 CSS 里明确请求的族名解析到含该码位的字体时才画得出来。

 做法：把这两个族名 assign 到本机真实存在、且含 U+F8FF 的 "SF Pro Text"。
   * 用 assign 而不是 prepend：彻底替换，免得原族名留在族列表里被再次模糊匹配回文楷。
   * 实测（无头 Firefox，用站点原样的字体栈）：
       - 替换前：「经典摇滚代表作品、[F8 FF] Music 经典摇滚」
       - 替换后：正常显示「经典摇滚代表作品、[logo] Music 经典摇滚」
     正文、中文、其它站点都不受影响（规则只按族名命中，通用族规则不变）。
   * 站点在 Firefox 里把 -apple-system / BlinkMacSystemFont 当 system-ui 处理，
     给这两个族名写 fontconfig 规则**无效**（实测），所以本文件不处理它们：
     正文中文仍按 fonts.conf 的 system-ui → sans-serif → 霞鹜文楷走。

 已知限制：
   * 只在页面 CSS 真的请求了这两个族名时生效（Apple 自己的站点都是）；页面用
     @font-face 定义同名 webfont 且加载失败时仍然救不了（同 60-web-icon-fonts.conf）。
   * 本机没有 Apple 的 "SF Pro Icons"，只能拿 "SF Pro Text" 顶。SF Pro Text 只含 12 个
     PUA 码位（U+F6D5–F6D8、F765、F799–F79B、F79E、F860、F861、F8FF），所以 SF Pro Icons
     里除苹果 logo 之外的私有图标仍然缺字（不会变成错误图标，只是依旧缺）。
   * 顺带确认过：music.apple.com 的播放三角、随机播放、加入/移出资料库那三个按钮都是
     内联 SVG path（连"已加入"的 ✓ 也是 `<path d="M6.9 12.9c…">`），不受字体影响；
     这页上只有「播放」这类文字才走字体。
-->
<fontconfig>
  <!-- 站点把 "SF Pro" / "SF Pro Icons" 当字体族名请求；本机只有 SF Pro Text/Display/Rounded -->
  <match target="pattern">
    <test name="family" compare="eq"><string>SF Pro</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>SF Pro Icons</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SF Pro Text</string></edit>
  </match>
</fontconfig>
