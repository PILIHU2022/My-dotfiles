# ================================ 代理组 =====================================
# 节点过滤器：排除含有"剩余/重置/天数/过期/已用/流量/到期"等关键字或日期的无效节点
FilterNode: &FilterNode '^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|家宽|剩余|重置|天数|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$'

proxy-groups:
  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: *FilterNode

  - name: Proxy
    type: select
    proxies:
      - 🚀 手动切换
      - ♻️ 自动选择
      - DIRECT

  - name: AI
    type: select
    proxies:
      - 🚀 手动切换
      - ♻️ 自动选择
      - Proxy
      - DIRECT

  - name: Apple_Service
    type: select
    proxies:
      - 🚀 手动切换
      - ♻️ 自动选择
      - Proxy
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    lazy: true
    tolerance: 50
    timeout: 3000
    include-all: true
    filter: *FilterNode

# ================================ 路由规则 ===================================
rules:
  - GEOSITE,private,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_ip,REJECT
  - RULE-SET,ad_reject_AWA,REJECT

  - DOMAIN-SUFFIX,gov.cn,DIRECT
  - DOMAIN-SUFFIX,.gov,DIRECT
  - DOMAIN-SUFFIX,.政务,DIRECT

  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,lan_non_ip,DIRECT

  - RULE-SET,game_download,DIRECT
  - GEOSITE,steam@cn,DIRECT

  - RULE-SET,download_domainset,Proxy
  - RULE-SET,download_non_ip,Proxy

  - RULE-SET,microsoft_cdn_non_ip,DIRECT   # 微软中国 CDN（download.microsoft.com 等国内节点）
  - RULE-SET,microsoft_non_ip,Proxy        # 微软全球服务（Bing/Outlook/Office365/Azure 等需代理）

  - RULE-SET,apple_cn,DIRECT
  - RULE-SET,apple_services,Apple_Service

  - RULE-SET,cdn_domainset,Proxy
  - RULE-SET,cdn_non_ip,Proxy

  - RULE-SET,ai_non_ip,AI

  - RULE-SET,stream_non_ip,Proxy

  - RULE-SET,telegram_non_ip,Proxy

  - RULE-SET,global_non_ip,Proxy

  - RULE-SET,telegram_ip,Proxy,no-resolve
  - RULE-SET,stream_ip,Proxy,no-resolve
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,domestic_ip,DIRECT,no-resolve
  - RULE-SET,china_ip,DIRECT,no-resolve
  - RULE-SET,china_ip_ipv6,DIRECT,no-resolve

  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  - MATCH,Proxy
