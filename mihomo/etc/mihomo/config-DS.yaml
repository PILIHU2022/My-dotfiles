# ============================================================================
# Mihomo 配置文件
# 参考: https://www.naomi.plus/code/exp/05.mihomo-config.html
# 文档: https://wiki.metacubex.one/config/
# 规则集: https://ruleset.skk.moe/
# ============================================================================

# ================================ 全局配置 ===================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
tcp-concurrent: true
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 127.0.0.1:9090

# ================================ TUN ========================================
tun:
  enable: true
  stack: mixed
  mtu: 1400
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: false

# ================================ DNS ========================================
# fake-ip + respect-rules 模式，国内域名走国内 DNS 直连，国外域名走代理解析
dns:
  enable: true
  ipv6: true
  prefer-h3: false
  use-hosts: false
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - rule-set:clash_fake_ip_filter
    - geosite:private
    - geosite:tracker
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  respect-rules: true

# ================================ Geo 数据 ===================================
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# ================================ 代理集 =====================================
proxy-providers:
  订阅A:
    type: http
    url: 'https://example.com/api/v1/client/subscribe?token=YOUR_SUBSCRIPTION_TOKEN'
    interval: 3600
    path: ./profile/provider-a.yaml
    health-check:
      enable: true
      interval: 180
      lazy: true
      url: https://cp.cloudflare.com/generate_204
    override:
      additional-prefix: "[订阅A] "
      skip-cert-verify: true

  订阅B:
    type: http
    url: 'https://example.com/api/v1/client/subscribe?token=YOUR_SUBSCRIPTION_TOKEN'
    interval: 3600
    path: ./profile/订阅B.yaml
    health-check:
      enable: true
      interval: 180
      lazy: true
      url: https://cp.cloudflare.com/generate_204
    override:
      additional-prefix: "[订阅B] "
      skip-cert-verify: true

# ================================ 规则集 =====================================
RuleSet_classical: &RuleSet_classical
  type: http
  behavior: classical
  interval: 43200
  format: text
  proxy: Proxy

RuleSet_domain: &RuleSet_domain
  type: http
  behavior: domain
  interval: 43200
  format: text
  proxy: Proxy

RuleSet_ipcidr: &RuleSet_ipcidr
  type: http
  behavior: ipcidr
  interval: 43200
  format: text
  proxy: Proxy

rule-providers:
  clash_fake_ip_filter:
    <<: *RuleSet_domain
    url: 'https://ruleset.skk.moe/Clash/domainset/clash_fake_ip_filter.txt'
    path: './rule_set/sukkaw/clash_fake_ip_filter.txt'

