# Mihomo (Clash Meta) 配置文件
# 优化版 - 添加注释并修正规则顺序问题（需用户确认）

# === 基础设置 ===
mixed-port: 7890          # 混合代理端口（HTTP/SOCKS5 自动识别）
port: 20173               # 纯 HTTP 代理端口
socks-port: 20172         # 纯 SOCKS5 代理端口
allow-lan: true           # 允许局域网连接
mode: rule                # 规则模式
log-level: warning        # 日志级别（调试时可改为 info）
ipv6: true                # 启用 IPv6

# 外部控制（RESTful API）
external-controller: 127.0.0.1:9090

# === TUN 虚拟网卡（用于透明代理）===
tun:
  enable: true
  device: Mihomo        # macOS 用户请删除此行
  stack: gvisor           # 使用 gvisor 栈，兼容性好
  mtu: 1400               # MTU 值，可根据网络调整
  # strict-route: true    # 严格路由（通常不需要）

# === DNS 配置（fake-ip 模式）===
dns:
  enable: true
  listen: 127.0.0.1:53    # 本机 DNS 监听（若做网关可改为 0.0.0.0:53）
  prefer-h3: true         # 优先使用 HTTP/3 DNS
  ipv6: true
  enhanced-mode: fake-ip
  respect-rules: true     # 遵循规则策略进行 DNS 解析
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:         # 不 fake-ip 的域名
    - '*.lan'
    - localhost.ptlogin2.qq.com

  default-nameserver:     # 初始 DNS（用于解析下面的 DoH 服务器）
    - 119.29.29.29
    - 223.5.5.5

  nameserver:             # 常规 DNS（国内 DoH）
    - https://doh.pub/dns-query
    - https://223.5.5.5/dns-query

  fallback:               # 备用 DNS（国外 DoH）
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

  proxy-server-nameserver: # 用于解析代理服务器域名的 DNS
    - https://doh.pub/dns-query
    - https://223.5.5.5/dns-query

  nameserver-policy:      # 按域名/规则集指定 DNS
    "+.apple.com":
    - https://doh.pub/dns-query
    - https://223.5.5.5/dns-query
    "+.archlinuxcn.org":
      - https://doh.pub/dns-query
    "geosite:cn,private":
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query

# === GeoData 资源文件 ===
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# === 代理节点 ===
proxies:
  - name: "直连"
    type: direct
    udp: true

# === 代理集（从远程订阅）===
proxy-providers:
  订阅A:
    type: http
    url: 'https://example.com/api/v1/client/subscribe?token=YOUR_SUBSCRIPTION_TOKEN'
    interval: 3600
    path: ./profile/provider-a.yaml
    health-check:
      enable: true
      interval: 180
      lazy: true
      url: http://www.gstatic.com/generate_204

  订阅B:
    type: http
    url: 'https://example.com/api/v1/client/subscribe?token=YOUR_SUBSCRIPTION_TOKEN'
    interval: 3600
    path: ./profile/订阅B.yaml
    health-check:
      enable: true
      interval: 180
      lazy: true
      url: http://www.gstatic.com/generate_204

# === 策略组 ===
proxy-groups:
  # 默认代理组（手动选择）
  - name: "PROXY"
    type: select
    proxies:
      - 直连
    use:
      - 订阅A
      - 订阅B

  # Apple 服务专用组（可手动切换直连或代理）
  - name: "Apple Services"
    type: select
    proxies:
      - 直连
    use:
      - 订阅A
      - 订阅B

  # ChatGPT 专用组（后备直连）
  - name: "ChatGPT"
    type: select
    proxies:
      - 直连          # 新增后备
    use:
      - 订阅A
      - 订阅B

  # 自动选择最快节点
  - name: "Auto"
    type: url-test
    use:
      - 订阅A
      - 订阅B
    proxies:
      - 直连          # 新增后备
    url: 'http://www.cloudflare.com'
    interval: 180
    lazy: true

  # 负载均衡（同一域名保持同一节点）
  - name: "load-balance"
    type: load-balance
    use:
      - 订阅A
      - 订阅B
    proxies:
      - 直连          # 新增后备
    url: 'http://cp.cloudflare.com'
    interval: 180
    # strategy: round-robin   # 轮询；默认 consistent-hashing

# === 规则集定义 ===
RuleSet_classical: &RuleSet_classical {type: http, behavior: classical, interval: 43200, format: text, proxy: PROXY}
RuleSet_domain:    &RuleSet_domain    {type: http, behavior: domain,    interval: 43200, format: text, proxy: PROXY}
RuleSet_ipcidr:    &RuleSet_ipcidr    {type: http, behavior: ipcidr,    interval: 43200, format: text, proxy: PROXY}

rule-providers:
  # 广告/恶意拦截
  reject_non_ip:
    <<: *RuleSet_classical
    url: 'https://ruleset.skk.moe/Clash/non_ip/reject.txt'
    path: './rule_set/sukkaw_ruleset/reject_non_ip.txt'
  reject_domainset:
    <<: *RuleSet_domain
    url: 'https://ruleset.skk.moe/Clash/domainset/reject.txt'
    path: './rule_set/sukkaw_ruleset/reject_domainset.txt'
  reject_ip:
    <<: *RuleSet_classical
    url: 'https://ruleset.skk.moe/Clash/ip/reject.txt'
    path: './rule_set/sukkaw_ruleset/reject_ip.txt'
  # 以下两个如果需要 REJECT-DROP 可保留，否则可删除
