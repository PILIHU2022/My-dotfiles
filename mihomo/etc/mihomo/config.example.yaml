# ================================ 路由规则 ====================================
# 规则从上到下逐条匹配，命中即停止
rules:
  # ======== [1] 广告 / 恶意 / 拦截 ========
  # 优先级最高：广告、恶意软件、钓鱼网站等直接阻断
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,REJECT
  - RULE-SET,reject_ip,REJECT,no-resolve
  # Loyalsoldier 去广告（与上面 skk 的拦截表互补；放最后，重叠域名保持原 REJECT/REJECT-DROP 行为）
  - RULE-SET,loyalsoldier_reject,REJECT

  # ======== [2] 内网 / 局域网 ========
  # 本地网络流量直连（路由器、打印机、NAS 等）
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,lan_ip,DIRECT,no-resolve

  # ======== [3] 国内直连 ========
  # 中国境内域名/IP 直连，提高访问速度
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  # ---- yacd 面板：腾讯云国内节点，直连 ----
  # 示例：面板域名解析到国内腾讯云 IP。走代理会被机场出口 reset
  # （实测 TLS unexpected eof；直连 0.03s 返回 200）。根域 / www 在海外且
  # 本身不可达，所以只对该主机名直连，不用 DOMAIN-SUFFIX 覆盖整域。
  - DOMAIN,yacd.example.com,DIRECT       # 替换成你的面板域名
  # ---- 国产 AI / Agent：直连（2026-11-07 起，2026-11-14 扩成全量）----
  # 背景：sukka 的 domestic(884 行) / direct(232) / ai(68) / global(1289) 四张表
  # 都不含国产 AI 域名，不显式加就一路落到 MATCH → Proxy（实测 qianwenai.com：
  #   [TCP] ... --> qianwenai.com:443 match Match using Proxy[[良心云] ...]）。
  #
  # 现在分两层：
  #   1) RULE-SET,ai_cn —— MetaCubeX 官方 geosite 的 category-ai-cn（129 条），
  #      每天自动更新，新出的国产 AI / Agent 服务不用再手工补；
  #   2) 下面的显式条目 —— 核心服务的确定性兜底（不依赖远程规则集是否拉取成功），
  #      以及上游 ai_cn 尚未收录、但实测解析到国内 IP 的补充域名。
  #
  # 已由 domestic 表覆盖、不必重复加的：通义网页/通义灵码（← aliyun.com）、
  # 阿里百炼/DashScope（← aliyuncs.com）、豆包（doubao.com）、元宝/混元/元器
  # （← tencent.com）、文心/文心快码（← baidu.com）、千帆（← baidubce.com）、
  # 火山方舟（← volces.com）、夸克（quark.cn）、有道（youdao.com）。
  #
  # 有意不覆盖的国际版（上游 ai_cn 里也有，但解析到境外 IP，直连反而绕远）：
  #   qwen.ai / qwenlm.ai（阿里云新加坡、香港）、z.ai（智谱海外品牌）。
  #   不写这三条的话，ai_cn 会把它们一并判成直连；显式指向 AI 组恢复原有的
  #   「.ai 走代理」行为（sukka global 表里有 DOMAIN-SUFFIX,ai）。
  #
  # 2026-11-14 实测：qwen.ai / qwenlm.ai 解析到阿里云新加坡、香港（139.95 / 8.212），
  # z.ai 解析到阿里云国际段（8.216），都不在国内。
  - DOMAIN-SUFFIX,qwen.ai,AI                 # Qwen 国际版（阿里云新加坡）
  - DOMAIN-SUFFIX,qwenlm.ai,AI               # Qwen 国际版
  - DOMAIN-SUFFIX,z.ai,AI                    # 智谱海外品牌 Z.ai
  - RULE-SET,ai_cn,DIRECT

  # ---- 核心服务兜底（不依赖远程规则集）----
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,deepseeksvc.com,DIRECT
  - DOMAIN-SUFFIX,qianwenai.com,DIRECT      # 通义千问
  - DOMAIN-SUFFIX,kimi.com,DIRECT           # Kimi（月之暗面）
  - DOMAIN-SUFFIX,moonshot.cn,DIRECT        # Kimi 国内站
  - DOMAIN-SUFFIX,bigmodel.cn,DIRECT        # 智谱清言
  - DOMAIN-SUFFIX,chatglm.cn,DIRECT         # 智谱清言
  - DOMAIN-SUFFIX,minimaxi.com,DIRECT       # MiniMax
  - DOMAIN-SUFFIX,hailuoai.com,DIRECT       # 海螺 AI（MiniMax）
  - DOMAIN-SUFFIX,baichuan-ai.com,DIRECT    # 百川智能
  - DOMAIN-SUFFIX,sensetime.com,DIRECT      # 商汤
  - DOMAIN-SUFFIX,stepfun.com,DIRECT        # 阶跃星辰
  - DOMAIN-SUFFIX,lingyiwanwu.com,DIRECT    # 零一万物

  # ---- 上游 ai_cn 尚未收录的国产 AI / Agent（2026-11-14 逐一实测解析到国内 IP）----
  - DOMAIN-SUFFIX,stepchat.cn,DIRECT        # 阶跃「跃问」聊天站
  - DOMAIN-SUFFIX,yuewen.cn,DIRECT          # 跃问
  - DOMAIN-SUFFIX,codegeex.cn,DIRECT        # 智谱 CodeGeeX（codegeex.com 在境外，不覆盖）
  - DOMAIN-SUFFIX,qoder.cn,DIRECT           # 阿里 Qoder 国内站（qoder.com 在境外，不覆盖）
  - DOMAIN-SUFFIX,iflow.cn,DIRECT           # 阿里心流 iFlow（Agent CLI）
  - DOMAIN-SUFFIX,modelscope.cn,DIRECT      # 魔搭 ModelScope（模型 / MCP 广场）
  - DOMAIN-SUFFIX,siliconflow.cn,DIRECT     # 硅基流动（siliconflow.com 在境外，不覆盖）
  - DOMAIN-SUFFIX,xfyun.cn,DIRECT           # 讯飞开放平台（星火 API）
  - DOMAIN-SUFFIX,modelbest.cn,DIRECT       # 面壁智能
  - DOMAIN-SUFFIX,mobvoi.com,DIRECT         # 出门问问
  - DOMAIN-SUFFIX,unisound.com,DIRECT       # 云知声
  - DOMAIN-SUFFIX,emotibot.com,DIRECT       # 竹间智能
  - DOMAIN-SUFFIX,vidu.com,DIRECT           # 生数科技 Vidu
  - DOMAIN-SUFFIX,minimax.chat,DIRECT       # MiniMax 旧 API 域名（minimaxi.com 之外）
  - RULE-SET,apple_cn_non_ip,DIRECT
  # ---- Apple Music：锁定中国大陆 storefront ----
  # Apple 依据「出口 IP 归属地」选择 storefront。music.apple.com 原本被
  # apple_services（含 DOMAIN-SUFFIX,apple.com）收进 Apple_Service 选择器，
  # 而该选择器的配置默认值是 Proxy；运行时选择存在 cache.db，一旦丢失就会
  # 回落到 Proxy —— 此时裸访问 music.apple.com/ 会被 302 到 /us/new，CN 账号
  # 随即报"出现错误，请刷新"。用显式规则绕过选择器，使 storefront 恒定。
  # 该后缀同时覆盖 amp-api.music.apple.com。
  - DOMAIN-SUFFIX,music.apple.com,DIRECT
  # 以下两个后缀同样参与 Apple Music 的区域/授权判定，却被 apple_services 收在
  # Apple_Service 选择器内。一并硬编码直连，使其也不依赖任何选择器状态。
  - DOMAIN-SUFFIX,media.apple.com,DIRECT
  - DOMAIN-SUFFIX,blobstore.apple.com,DIRECT
  # Apple 自有网段：store-*.blobstore.apple.com / buy.music.apple.com /
  # mvod.itunes.apple.com 等都在 17/8 内。即使域名没被嗅探出来，也能按 IP
  # 判定为直连，不依赖 sniff 是否成功。
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  # Sukka apple_cdn：使用中国大陆 CDN 的 Apple 域，涵盖 mzstatic 封面图床
  # （is1-5-ssl / a1-5 / s.mzstatic.com）、audio-ssl/aod.itunes.apple.com 音频流
  # 以及 oscdn、swcdn。
  - RULE-SET,apple_cdn,DIRECT
  - RULE-SET,domestic_ip,DIRECT,no-resolve
  - RULE-SET,china_ip,DIRECT,no-resolve
  - IP-CIDR,203.0.113.1/32,DIRECT,no-resolve  # VPS 服务器直连
  # ---- 国内域名兜底：GeoSite cn（2026-11-14）----
  # skk 的 domestic 表只有 884 行；GeoSite 的 cn 集合实测 118,302 条记录，
  # 覆盖大量国内中小站点和国产 AI / Agent 之外的长尾域名。这是纯域名判定：
  # 命中即直连，**不触发任何 DNS 解析**，所以既不多一次查询，也不增加泄露面。
  # 放在 [3] 段末尾（apple / AI 例外 / china_ip 之后），前面的显式规则优先。
  - GEOSITE,cn,DIRECT

  # ======== [3.2] Tailscale 直连 ========
  # 与 dns.fake-ip-filter 里的 tailscale 域名配套：
  #   * tailscaled 自己的连接带 fwmark，本来就不进 mihomo；这些规则管的是
  #     浏览器打开登录页（login.tailscale.com）以及其它程序访问 tailnet 的情况。
  #   * 命中 DIRECT 后，respect-rules 会让 DNS 改用 direct-nameserver（国内 DoH）
  #     解析，拿到的就是 192.200.0.x 的真实地址，不需要再绕代理。
  #   * 若要改成走代理（例如所在网络直连 controlplane 不通），把这四条
  #     DOMAIN-SUFFIX 的 DIRECT 换成 Proxy 即可，同时保留 fake-ip-filter 豁免。
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - DOMAIN-SUFFIX,tailscale.net,DIRECT
  - DOMAIN-SUFFIX,ts.net,DIRECT
  # tailnet 网段（100.64.0.0/10）。正常情况下 tailscaled 的 ip rule 5270
  # 会先把这些包送去 tailscale0，轮不到 mihomo；这条只是登录前/掉线时的兜底，
  # 防止 tailnet 地址被 MATCH 误送去代理出口。
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ======== [3.5] 拒绝 QUIC（UDP 443） ========
  # Apple 的 CDN 在 Akamai / Fastly 上，没有可枚举的网段。QUIC 一旦嗅探不出
  # SNI 就只剩 IP 匹配，最终落到 MATCH → Proxy，从机房出口出去，Apple 无法
  # 地理定位 → 回落到 /us/ storefront。拒绝 UDP 443 让浏览器退回 TCP/TLS，
  # SNI 可稳定嗅探，域名规则必然命中。放在这里：已命中的域名/IP 规则不受
  # 影响，只拦截「没被识别出来、即将落到 MATCH」的 QUIC。
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # ======== [4] Steam 下载直连 ========
  # Steam 游戏下载走国内 CDN，享受满速下载
  - DOMAIN-SUFFIX,steampipe-partner.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,steampipe-kr.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,steampipe.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,content-origin.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,content.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamserver.net,DIRECT
  - DOMAIN-SUFFIX,fastly.steamstatic.com,DIRECT
  - DOMAIN,steamcdn-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - GEOSITE,steam@cn,DIRECT

  # ======== [5] Apple 服务 ========
  # Apple 服务走 Apple_Service 组（可在面板中选择 代理 或 直连）
  - RULE-SET,apple_services,Apple_Service

  # ======== [6] AI ========
  # ChatGPT / Gemini / Claude 等 AI 服务走 AI 组
  - RULE-SET,ai_non_ip,AI
  # gemini.google.com 也在 google.com 之下，必须在「谷歌」规则之前显式指向 AI
  - DOMAIN,gemini.google.com,AI

