  # 与「验证服务」组配套：这些域名必须与主站同一出口，且该出口不能被 Cloudflare
  # 在 challenges.cloudflare.com 上重置，否则注册/登录的 Turnstile 校验拿不到
  # token（典型表现：页面能打开、验证码区域空白或转圈，最后提示「验证失败」）。
  - DOMAIN-SUFFIX,challenges.cloudflare.com,验证服务
  - DOMAIN-SUFFIX,turnstile.cloudflare.com,验证服务
  - DOMAIN-SUFFIX,commandcode.ai,验证服务

  # ======== [7] 流媒体 ========
  # Netflix / Disney+ / YouTube / Spotify 等流媒体走代理
  - RULE-SET,stream_non_ip,流媒体
  - RULE-SET,stream_ip,流媒体,no-resolve

