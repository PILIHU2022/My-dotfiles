# ================================ 路由规则 ====================================
# 规则从上到下逐条匹配，命中即停止
rules:
  # ======== [1] 广告 / 恶意 / 拦截 ========
  # 优先级最高：广告、恶意软件、钓鱼网站等直接阻断
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,REJECT
  - RULE-SET,reject_ip,REJECT

  # ======== [2] 内网 / 局域网 ========
  # 本地网络流量直连（路由器、打印机、NAS 等）
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,lan_ip,DIRECT,no-resolve

  # ======== [3] 国内直连 ========
  # 中国境内域名/IP 直连，提高访问速度
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,apple_cn_non_ip,DIRECT
  # ---- Apple Music：锁定中国大陆 storefront ----
  # Apple 依据「出口 IP 归属地」选择 storefront。music.apple.com 原本被
  # apple_services（含 DOMAIN-SUFFIX,apple.com）收进 Apple_Service 选择器，
  # 而该选择器的配置默认值是 Proxy；运行时选择存在 cache.db，一旦丢失就会
  # 回落到 Proxy —— 此时裸访问 music.apple.com/ 会被 302 到 /us/new，CN 账号
  # 随即报"出现错误，请刷新"。用显式规则绕过选择器，使 storefront 恒定。
  # 该后缀同时覆盖 amp-api.music.apple.com。
  - DOMAIN-SUFFIX,music.apple.com,DIRECT
  # 以下两个后缀同样参与 Apple Music 的区域/授权判定，却被 apple_services 收在
  # Apple_Service 选择器内。一并硬编码直连，使其也不依赖任何选择器状态。
  - DOMAIN-SUFFIX,media.apple.com,DIRECT
  - DOMAIN-SUFFIX,blobstore.apple.com,DIRECT
  # Apple 自有网段：store-*.blobstore.apple.com / buy.music.apple.com /
  # mvod.itunes.apple.com 等都在 17/8 内。即使域名没被嗅探出来，也能按 IP
  # 判定为直连，不依赖 sniff 是否成功。
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  # Sukka apple_cdn：使用中国大陆 CDN 的 Apple 域，涵盖 mzstatic 封面图床
  # （is1-5-ssl / a1-5 / s.mzstatic.com）、audio-ssl/aod.itunes.apple.com 音频流
  # 以及 oscdn、swcdn。该 provider 原本只定义、从未被任何 rule 引用。
  - RULE-SET,apple_cdn,DIRECT
  - RULE-SET,domestic_ip,DIRECT,no-resolve
  - RULE-SET,china_ip,DIRECT,no-resolve
  - IP-CIDR,72.11.144.205/32,DIRECT,no-resolve  # VPS 服务器直连

  # ======== [3.5] 拒绝 QUIC（UDP 443） ========
  # Apple 的 CDN 在 Akamai / Fastly 上，没有可枚举的网段。QUIC 一旦嗅探不出
  # SNI 就只剩 IP 匹配，最终落到 MATCH → Proxy，从机房出口出去，Apple 无法
  # 地理定位 → 回落到 /us/ storefront。拒绝 UDP 443 让浏览器退回 TCP/TLS，
  # SNI 可稳定嗅探，域名规则必然命中。放在这里：已命中的域名/IP 规则不受
  # 影响，只拦截「没被识别出来、即将落到 MATCH」的 QUIC。
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # ======== [4] Steam 下载直连 ========
  # Steam 游戏下载走国内 CDN，享受满速下载
  - DOMAIN-SUFFIX,steampipe-partner.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,steampipe-kr.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,steampipe.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,content-origin.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,content.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamserver.net,DIRECT
  - DOMAIN,*.steamcontent.com,DIRECT
  - DOMAIN,fastly.cdn.steampipe.steamcontent.com,DIRECT
  - DOMAIN,cdn.fastly.steamstatic.com,DIRECT
  - DOMAIN,*.fastly.steamstatic.com,DIRECT
  - DOMAIN-SUFFIX,fastly.steamstatic.com,DIRECT
  - DOMAIN,steamcdn-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - GEOSITE,steam@cn,DIRECT

  # ======== [5] Apple 服务 ========
  # Apple 服务走 Apple_Service 组（可在面板中选择 代理 或 直连）
  - RULE-SET,apple_services,Apple_Service

  # ======== [6] 微软 ========
  # 微软全球服务走代理（Bing / Outlook / Office365 / Azure 等）
  - RULE-SET,microsoft_cdn_non_ip,Proxy
  - RULE-SET,microsoft_non_ip,Proxy

  # ======== [7] CDN 加速 ========
  # 全球 CDN 资源走代理获取更优节点
  - RULE-SET,cdn_domainset,Proxy
  - RULE-SET,cdn_non_ip,Proxy

  # ======== [8] 流媒体 ========
  # Netflix / Disney+ / YouTube / Spotify 等流媒体走代理
  - RULE-SET,stream_non_ip,Proxy
  - RULE-SET,stream_ip,Proxy,no-resolve

  # ======== [9] Telegram ========
  # Telegram 走代理（国内直连不稳定）
  - RULE-SET,telegram_non_ip,Proxy
  - RULE-SET,telegram_ip,Proxy,no-resolve

  # ======== [10] AI ========
  # ChatGPT / Gemini / Claude 等 AI 服务走 AI 组
  - RULE-SET,ai_non_ip,AI
  - DOMAIN,gemini.google.com,AI

  # ======== [11] 大文件下载 ========
  # 软件更新、系统镜像等大文件走代理（利用代理带宽提速）
  - RULE-SET,download_domainset,Proxy
  - RULE-SET,download_non_ip,Proxy

  # ======== [12] 全球其余 ========
  # 未被以上规则匹配的境外域名/服务走代理
  - RULE-SET,global_non_ip,Proxy

  # ======== [13] 兜底 ========
  # 所有未被任何规则匹配的流量，默认走 Proxy 组
  # 确保没有流量漏网直连（防止 DNS 泄露和 IP 泄露）
  - MATCH,Proxy
