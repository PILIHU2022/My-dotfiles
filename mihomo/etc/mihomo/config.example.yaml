  # 微软全球服务（Bing / Outlook / Office365 / Azure 等）
  - RULE-SET,microsoft_cdn_non_ip,微软
  - RULE-SET,microsoft_non_ip,微软

  # ======== [10] 谷歌 / GitHub ========
  # 单独成组，方便把开发流量固定到某个地区
  # ---- Google Fonts：DIRECT（2026-11-14）----
  # fonts.gstatic.com / fonts.googleapis.com 走代理会在 TLS 握手阶段被机场出口
  # 掐断（unexpected eof，多节点实测一致），Google Maps 图标因此全变豆腐块。
  # 这两个域名有 Google 中国本地 CDN 节点，直连即可；respect-rules 下 DIRECT
  # 出站用 direct-nameserver（国内 DoH）解析，天然拿到本地 CDN IP。
  # 细见 docs/mihomo-config-structure.md 3.10。
  - DOMAIN-SUFFIX,fonts.googleapis.com,DIRECT
  - DOMAIN-SUFFIX,fonts.gstatic.com,DIRECT
  - DOMAIN-SUFFIX,google.com,谷歌
  - DOMAIN-SUFFIX,googleapis.com,谷歌
  - DOMAIN-SUFFIX,gstatic.com,谷歌
  - DOMAIN-SUFFIX,googleusercontent.com,谷歌
  - DOMAIN-SUFFIX,ggpht.com,谷歌
  - DOMAIN-SUFFIX,github.com,GitHub
  - DOMAIN-SUFFIX,githubusercontent.com,GitHub
  - DOMAIN-SUFFIX,githubassets.com,GitHub
  - DOMAIN-SUFFIX,github.io,GitHub
  - DOMAIN-SUFFIX,ghcr.io,GitHub

  # ======== [11] CDN 加速 ========
  # 全球 CDN 资源走代理获取更优节点
  - RULE-SET,cdn_domainset,Proxy
  - RULE-SET,cdn_non_ip,Proxy

  # ======== [12] 大文件下载 ========
  # 软件更新、系统镜像等大文件走代理（利用代理带宽提速）
  - RULE-SET,download_domainset,Proxy
  - RULE-SET,download_non_ip,Proxy

  # ======== [13] 全球其余 ========
  # 未被以上规则匹配的境外域名/服务走代理
  - RULE-SET,global_non_ip,Proxy

  # ======== [13.5] 国内 IP 兜底判断 ========
  # 域名层规则全部没命中时，再按「解析结果是不是国内 IP」判一次：是 → 直连，
  # 否则落到下面的 MATCH → Proxy。这条专门兜住「GeoSite cn / skk 表都没收录，
  # 但实际是国内服务」的域名，以及裸 IP 连接。
  #
  # 为什么不能带 no-resolve：fake-ip 模式下连接目标是 198.18.x 假地址，带
  # no-resolve 的 IP 规则会直接跳过（同 3.8 的 yacd 案例）；不带 no-resolve 时
  # mihomo 会用**内部 DoH** 解析域名后再比较，系统解析器全程不参与。
  #
  # 泄露面：只有「前面所有规则都没命中」的域名才会触发这次解析，用的是
  # dns.nameserver（1.1.1.1 / 8.8.8.8 的 IP 形式 DoH）。在 respect-rules 下，
  # 这条 DoH 连接本身命中 MATCH → Proxy，即查询从代理出口发出：本地网络只能
  # 看到「到代理节点的流量」，看不到 DNS 内容（实测日志见 docs 3.10）。
  # 代价：未知域名多一次 DNS 往返；若该域名在境外 DNS 视角下解析到海外 CDN，
  # 会被判成非国内而继续走代理——方向是安全的（宁可走代理，不误判直连）。
  - GEOIP,CN,DIRECT

  # ======== [14] 兜底 ========
  # 所有未被任何规则匹配的流量，默认走 Proxy 组
  # 确保没有流量漏网直连（防止 DNS 泄露和 IP 泄露）
  - MATCH,Proxy
