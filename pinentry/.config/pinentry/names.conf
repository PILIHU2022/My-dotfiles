# pinentry 提示框的“密钥名称”别名表
#
# 读取者：~/.local/bin/pinentry-named（stow 包 pinentry）
# 作用  ：把 gpg-agent 弹窗里的机器标识换成下面手写的名称
#         · SSH    弹窗：SHA256:gAOVsakm7Zl63ScocGkE5QlVA8QUATC0onlaYruUot4 指纹
#         · OpenPGP 弹窗：16 位密钥 ID（“标识 B5BB2FA791A9AC00”）
#
# 格式：<匹配键> <显示名称>；空行、# 开头忽略；名称可含空格并取到行尾
#
# 匹配键可以带场景前缀，让同一个 GPG 密钥在两种弹窗里显示不同文本：
#     ssh:<匹配键>   只作用于 SSH 弹窗
#     gpg:<匹配键>   只作用于 OpenPGP 弹窗
#     <匹配键>       两种场景都生效（兜底）
# <匹配键> 本身可以是：16 位密钥 ID / 40 位 keygrip / SHA256: 指纹
# （十六进制大小写不敏感；用 `pinentry-named --list` 可以直接查）
# 没写进来的密钥保持原样显示机器标识。
#
# 改完立即生效（每次弹窗前重新读取），不需要重启 gpg-agent。

# ------------------------------------------------- OpenPGP（签名 / 加密）--
B5BB2FA791A9AC00  Spark@And <Spark@Android>
50CED28AB4F60FA3  Spark <Spark@ColdBackup>
623B7C89A9BE9F48  Spark <Spark-CN@outlook.com>

# -------------------------------------------------------------------- SSH --
# 你的 SSH 走的就是 GPG：用的正是 Spark <Spark-CN@outlook.com> 这把密钥的
# 认证子钥 F25B6CB0CF3F272C（keygrip 64D949A70A5C4C616608202C9DDE44A4F5F5758F）。
# 下面这条带 ssh: 前缀，因此只改 SSH 弹窗；OpenPGP 弹窗仍用上面的通用文本。
ssh:SHA256:gAOVsakm7Zl63ScocGkE5QlVA8QUATC0onlaYruUot4  Spark-CN · SSH 认证子钥

# 指纹匹配键会随 ssh-fingerprint-digest 变化；想与摘要算法解耦可改用 keygrip：
#ssh:64D949A70A5C4C616608202C9DDE44A4F5F5758F  Spark-CN · SSH 认证子钥
