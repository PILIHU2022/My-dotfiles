# pinentry 提示框“首行说明”的文字修正表
#
# 读取者：~/.local/bin/pinentry-named（stow 包 pinentry）
# 格式  ：<原文> <替换文本>；空行、# 开头忽略
#         · 按文件中的顺序逐条做【字面】替换（不是正则）
#         · 只作用于提示框的“首行说明”，不会碰你在 names.conf 里写的密钥名称
#         · 需要写 % 时按原样写即可，脚本会自动转义成 Assuan 的 %25
#
# 改完立即生效（每次弹窗前重新读取），不需要重启 gpg-agent。

# gpg-agent 的简体中文翻译里用的是小写 ssh，这里统一改成大写 SSH
ssh  SSH
