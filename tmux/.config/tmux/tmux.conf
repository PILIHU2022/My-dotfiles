%if "#{SSH_CONNECTION}"
set -g prefix C-b
set -g @tmux_prefix "C-b"
%else
set -g prefix C-a
set -g @tmux_prefix "C-a"
%endif

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ",xterm-kitty:Tc"
set -as terminal-features ",xterm*:RGB"

set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g focus-events on
set -g escape-time 10
set -g repeat-time 500

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
setw -g aggressive-resize on
set -g status-interval 5

set -g status-position bottom
set -g status-justify left
set -g status-left-length 56
set -g status-right-length 96

set -g status-style "fg=#cdd6f4,bg=#181825"
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] #[fg=#a6adc8] #{@tmux_prefix} ? help  #{@tmux_prefix} r reload  #{@tmux_prefix} d detach "
set -g status-right "#[fg=#a6e3a1,bg=#181825] #(~/.config/tmux/scripts/system-status.sh) #[fg=#a6adc8,bg=#181825] %Y-%m-%d %H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#313244] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W "
setw -g window-status-last-style "fg=#f9e2af,bg=#313244"
setw -g window-status-activity-style "fg=#f38ba8,bg=#313244,bold"
setw -g window-status-bell-style "fg=#1e1e2e,bg=#f38ba8,bold"
setw -g pane-border-style "fg=#585b70"
setw -g pane-active-border-style "fg=#89b4fa"
setw -g mode-style "fg=#1e1e2e,bg=#f9e2af"
setw -g copy-mode-match-style "fg=#1e1e2e,bg=#f9e2af"
setw -g copy-mode-current-match-style "fg=#11111b,bg=#fab387,bold"
setw -g clock-mode-colour "#89b4fa"
set -g display-panes-colour "#585b70"
set -g display-panes-active-colour "#89b4fa"
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#45475a"

bind C-b send-prefix
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: configuration reloaded"

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r n next-window
bind -r p previous-window
bind Tab last-window

bind C new-session -c "#{pane_current_path}"
bind s choose-tree -Zs
bind -r ')' switch-client -n
bind -r '(' switch-client -p

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
