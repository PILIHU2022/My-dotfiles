# XDG desktop portal 后端选择（用户级覆盖，优先级最高）
#
# 背景：Fcitx5/文件对话框之外，Secret 接口也有两个后端可选：
#   /usr/share/xdg-desktop-portal/portals/gnome-keyring.portal
#       DBusName=org.freedesktop.secrets             UseIn=gnome
#   /usr/share/xdg-desktop-portal/portals/kwallet.portal
#       DBusName=org.freedesktop.impl.portal.desktop.kwallet   UseIn=kde
#
# 本机 XDG_CURRENT_DESKTOP=Hyprland，两个 UseIn 都不匹配，于是后端由
# xdg-desktop-portal 按字典序兜底挑选（gnome-keyring < kwallet），属于
# 「碰巧」而不是「确定」。这里显式钉死到 KWallet 6。
#
# 值用的是 .portal 文件名去掉扩展名后的后端名（kwallet.portal → kwallet），
# 见 portals.conf(5)。只覆盖 Secret 这一个接口，不动其它 portal。
[preferred]
org.freedesktop.impl.portal.Secret=kwallet
