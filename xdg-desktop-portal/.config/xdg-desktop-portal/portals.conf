# XDG desktop portal 后端选择（用户级覆盖，优先级最高）
#
# 1) Secret：gnome-keyring 与 kwallet 两个后端都声明了 UseIn，但本机
#    XDG_CURRENT_DESKTOP=Hyprland 两个都不匹配，xdg-desktop-portal 会按
#    字典序兜底（gnome-keyring < kwallet）——属于「碰巧」而不是「确定」。
#    这里显式钉死到 KWallet 6：
#      gnome-keyring.portal  DBusName=org.freedesktop.secrets  UseIn=gnome
#      kwallet.portal        DBusName=...desktop.kwallet      UseIn=kde
#
# 2) FileChooser：gtk 和 kde 两个后端都能弹文件对话框。为了和应用内一致
#    的 GTK 外观、输入法行为与排序（文件夹在前 → 文件 A-Z），钉死 GTK
#    后端；否则安装集合或字典序一变，Qt 应用就可能换成 KDE 对话框。
#
# 值用 .portal 文件名去掉扩展名后的后端名（kwallet.portal → kwallet，
# gtk.portal → gtk），见 portals.conf(5)。
[preferred]
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.FileChooser=gtk
